<script>
/* =========================================================
   ELITE WORKFORCE SOLUTIONS
   SUPABASE CLOUD + PRIVATE CRM
   COMPLETE CORRECTED SCRIPT
   ========================================================= */

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const STORAGE_KEY = 'elite_workforce_private_leads_v1';

const SUPABASE_URL =
  'https://maakqzczkhkoimlmnvws.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_kiZxMM-2_11uQA_GQctlxw_DoEo_pu1';

const cloudEnabled =
  SUPABASE_URL.startsWith('https://') &&
  !SUPABASE_URL.includes('YOUR_') &&
  !!SUPABASE_PUBLISHABLE_KEY &&
  !SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');

const supabaseClient =
  cloudEnabled && window.supabase
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      )
    : null;

let cloudUser = null;


/* =========================================================
   LOCAL CRM DATA
   ========================================================= */

let leads = [];

try {
  const saved = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || '[]'
  );

  leads = Array.isArray(saved) ? saved : [];
} catch (error) {
  console.error('Local CRM data error:', error);
  leads = [];
}


function saveLocalLeads() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(leads)
    );
  } catch (error) {
    console.error('Could not save local CRM:', error);
  }
}


/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


/* =========================================================
   CREATE UNIQUE LOCAL ID
   ========================================================= */

function createLeadId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID === 'function'
  ) {
    return window.crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    '-' +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );
}


/* =========================================================
   CRM RENDER
   ========================================================= */

function renderLeads() {

  const body =
    document.getElementById('leadBody');

  const empty =
    document.getElementById('emptyLeads');

  if (!body) return;


  const search =
    (
      document.getElementById('searchLead')?.value ||
      ''
    )
      .toLowerCase()
      .trim();


  const region =
    document.getElementById('regionFilter')?.value ||
    '';


  const status =
    document.getElementById('statusFilter')?.value ||
    '';


  const filtered =
    leads.filter(function (lead) {

      const searchableText = [
        lead.company,
        lead.contact,
        lead.phone,
        lead.trade,
        lead.need,
        lead.region,
        lead.source,
        lead.website,
        lead.notes
      ]
        .join(' ')
        .toLowerCase();


      const matchesSearch =
        !search ||
        searchableText.includes(search);


      const matchesRegion =
        !region ||
        lead.region === region;


      const matchesStatus =
        !status ||
        lead.status === status;


      return (
        matchesSearch &&
        matchesRegion &&
        matchesStatus
      );
    });


  body.innerHTML = '';


  filtered.forEach(function (lead) {

    let badgeClass = 'new';


    if (lead.status === 'Contacted') {
      badgeClass = 'contacted';
    }

    if (lead.status === 'Follow-up') {
      badgeClass = 'follow';
    }

    if (lead.status === 'Converted') {
      badgeClass = 'converted';
    }

    if (lead.status === 'Closed') {
      badgeClass = 'closed';
    }


    const row =
      document.createElement('tr');


    row.innerHTML = `

      <td>
        ${escapeHTML(lead.company)}
      </td>

      <td>
        ${escapeHTML(lead.region)}
      </td>

      <td>
        ${escapeHTML(lead.contact)}
      </td>

      <td>
        ${escapeHTML(lead.phone)}
      </td>

      <td>
        ${escapeHTML(lead.trade)}
      </td>

      <td>
        ${escapeHTML(lead.need)}
      </td>

      <td>
        ${escapeHTML(lead.source)}
      </td>

      <td>
        ${escapeHTML(lead.follow || '')}
      </td>

      <td>
        <span class="badge ${badgeClass}">
          ${escapeHTML(lead.status || 'New')}
        </span>
      </td>

      <td>

        <button
          type="button"
          onclick="editLead('${escapeHTML(lead.id)}')">
          Edit
        </button>

        <button
          type="button"
          onclick="deleteLead('${escapeHTML(lead.id)}')">
          Delete
        </button>

      </td>

    `;


    body.appendChild(row);

  });


  if (empty) {

    empty.style.display =
      filtered.length
        ? 'none'
        : 'block';

  }


  updateCRMStats();
}


/* =========================================================
   CRM STATISTICS
   ========================================================= */

function updateCRMStats() {

  const total =
    document.getElementById('statTotal');

  const newCount =
    document.getElementById('statNew');

  const follow =
    document.getElementById('statFollow');

  const converted =
    document.getElementById('statConverted');


  if (total) {
    total.textContent =
      leads.length;
  }


  if (newCount) {
    newCount.textContent =
      leads.filter(
        lead => lead.status === 'New'
      ).length;
  }


  if (follow) {
    follow.textContent =
      leads.filter(
        lead => lead.status === 'Follow-up'
      ).length;
  }


  if (converted) {
    converted.textContent =
      leads.filter(
        lead => lead.status === 'Converted'
      ).length;
  }

}


/* =========================================================
   OPEN CRM MODAL
   ========================================================= */

function openLeadModal(id = '') {

  const modal =
    document.getElementById('leadModal');

  if (!modal) return;


  const lead =
    leads.find(
      item =>
        String(item.id) === String(id)
    );


  const modalTitle =
    document.getElementById('modalTitle');

  if (modalTitle) {

    modalTitle.textContent =
      lead
        ? 'Edit Lead'
        : 'Add New Lead';

  }


  const fields = {

    leadId: lead?.id || '',

    leadCompany: lead?.company || '',

    leadRegion: lead?.region || '',

    leadContact: lead?.contact || '',

    leadPhone: lead?.phone || '',

    leadTrade: lead?.trade || '',

    leadNeed: lead?.need || '',

    leadSource: lead?.source || '',

    leadFollow: lead?.follow || '',

    leadStatus: lead?.status || 'New',

    leadWebsite: lead?.website || '',

    leadNotes: lead?.notes || ''

  };


  Object.keys(fields).forEach(function (id) {

    const element =
      document.getElementById(id);

    if (element) {
      element.value = fields[id];
    }

  });


  modal.style.display = 'flex';
}


/* =========================================================
   CLOSE CRM MODAL
   ========================================================= */

function closeLeadModal() {

  const modal =
    document.getElementById('leadModal');

  if (modal) {
    modal.style.display = 'none';
  }

}


/* =========================================================
   EDIT LEAD
   ========================================================= */

function editLead(id) {
  openLeadModal(id);
}


/* =========================================================
   SAVE CRM LEAD
   ========================================================= */

async function saveLead(event) {

  if (event) {
    event.preventDefault();
  }


  const leadId =
    document
      .getElementById('leadId')
      ?.value
      ?.trim();


  const lead = {

    id:
      leadId ||
      createLeadId(),

    company:
      document
        .getElementById('leadCompany')
        ?.value
        ?.trim() ||
      '',

    region:
      document
        .getElementById('leadRegion')
        ?.value
        ?.trim() ||
      '',

    contact:
      document
        .getElementById('leadContact')
        ?.value
        ?.trim() ||
      '',

    phone:
      document
        .getElementById('leadPhone')
        ?.value
        ?.trim() ||
      '',

    trade:
      document
        .getElementById('leadTrade')
        ?.value
        ?.trim() ||
      '',

    need:
      document
        .getElementById('leadNeed')
        ?.value
        ?.trim() ||
      '',

    source:
      document
        .getElementById('leadSource')
        ?.value
        ?.trim() ||
      '',

    follow:
      document
        .getElementById('leadFollow')
        ?.value ||
      '',

    status:
      document
        .getElementById('leadStatus')
        ?.value ||
      'New',

    website:
      document
        .getElementById('leadWebsite')
        ?.value
        ?.trim() ||
      '',

    notes:
      document
        .getElementById('leadNotes')
        ?.value
        ?.trim() ||
      ''

  };


  if (!lead.company) {

    alert(
      'Please enter company name.'
    );

    return;
  }


  const existingIndex =
    leads.findIndex(
      item =>
        String(item.id) ===
        String(lead.id)
    );


  if (existingIndex >= 0) {

    leads[existingIndex] =
      lead;

  } else {

    leads.push(lead);

  }


  saveLocalLeads();

  renderLeads();

  closeLeadModal();


  /* Save to Supabase when logged in */

  if (cloudUser) {

    await saveLeadToCloud(
      lead
    );

  }

}


/* =========================================================
   DELETE CRM LEAD
   ========================================================= */

async function deleteLead(id) {

  const confirmed =
    confirm(
      'Are you sure you want to delete this lead?'
    );


  if (!confirmed) {
    return;
  }


  leads =
    leads.filter(
      lead =>
        String(lead.id) !==
        String(id)
    );


  saveLocalLeads();

  renderLeads();


  if (
    cloudUser &&
    supabaseClient
  ) {

    const { error } =
      await supabaseClient
        .from('crm_leads')
        .delete()
        .eq(
          'user_id',
          cloudUser.id
        )
        .eq(
          'local_id',
          String(id)
        );


    if (error) {

      console.error(
        'Cloud delete error:',
        error
      );


      alert(
        'Cloud delete failed: ' +
        error.message
      );

    }

  }

}


/* =========================================================
   CONVERT LOCAL LEAD → SUPABASE ROW
   ========================================================= */

function leadToCloudRow(lead) {

  if (!cloudUser) {
    return null;
  }


  return {

    local_id:
      String(lead.id),

    user_id:
      cloudUser.id,

    company_name:
      lead.company || '',

    contact_person:
      lead.contact || '',

    phone:
      lead.phone || '',

    region:
      lead.region || '',

    trade:
      lead.trade || '',

    need:
      lead.need || '',

    source:
      lead.source || '',

    follow:
      lead.follow || null,

    status:
      lead.status || 'New',

    website:
      lead.website || '',

    notes:
      lead.notes || ''

  };

}


/* =========================================================
   SAVE ONE LEAD TO CLOUD
   ========================================================= */

async function saveLeadToCloud(lead) {

  if (
    !cloudUser ||
    !supabaseClient
  ) {
    return false;
  }


  const row =
    leadToCloudRow(lead);


  if (!row) {
    return false;
  }


  const { error } =
    await supabaseClient
      .from('crm_leads')
      .upsert(
        row,
        {
          onConflict:
            'user_id,local_id'
        }
      );


  if (error) {

    console.error(
      'Cloud save error:',
      error
    );


    alert(
      'Cloud save failed: ' +
      error.message
    );


    return false;
  }


  return true;
}


/* =========================================================
   LOAD CRM FROM SUPABASE
   ========================================================= */

async function loadCloudLeads() {

  if (
    !cloudUser ||
    !supabaseClient
  ) {

    alert(
      'Please login first.'
    );

    return;
  }


  const { data, error } =
    await supabaseClient
      .from('crm_leads')
      .select('*')
      .eq(
        'user_id',
        cloudUser.id
      )
      .order(
        'created_at',
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      'Cloud load error:',
      error
    );


    alert(
      'Could not load cloud leads: ' +
      error.message
    );


    return;
  }


  leads =
    (data || []).map(
      function (row) {

        return {

          id:
            row.local_id ||
            row.id,

          company:
            row.company_name ||
            '',

          contact:
            row.contact_person ||
            '',

          phone:
            row.phone ||
            '',

          region:
            row.region ||
            '',

          trade:
            row.trade ||
            '',

          need:
            row.need ||
            '',

          source:
            row.source ||
            '',

          follow:
            row.follow ||
            '',

          status:
            row.status ||
            'New',

          website:
            row.website ||
            '',

          notes:
            row.notes ||
            ''

        };

      }
    );


  saveLocalLeads();

  renderLeads();
}


/* =========================================================
   SYNC LOCAL CRM → SUPABASE
   ========================================================= */

async function syncLocalToCloud() {

  if (
    !cloudUser ||
    !supabaseClient
  ) {

    alert(
      'Please login first.'
    );

    return;
  }


  if (!leads.length) {

    alert(
      'There are no local leads to sync.'
    );

    return;
  }


  let successCount = 0;


  for (
    const lead of leads
  ) {

    const row =
      leadToCloudRow(lead);


    if (!row) {
      continue;
    }


    const { error } =
      await supabaseClient
        .from('crm_leads')
        .upsert(
          row,
          {
            onConflict:
              'user_id,local_id'
          }
        );


    if (!error) {

      successCount++;

    } else {

      console.error(
        'Sync error:',
        error
      );

    }

  }


  alert(
    successCount +
    ' lead(s) synced to Supabase.'
  );


  await loadCloudLeads();
}


/* =========================================================
   SUPABASE SIGN UP
   ========================================================= */

async function cloudSignUp() {

  if (!supabaseClient) {

    alert(
      'Supabase is not configured.'
    );

    return;
  }


  const email =
    document
      .getElementById('cloudEmail')
      ?.value
      ?.trim();


  const password =
    document
      .getElementById('cloudPassword')
      ?.value;


  if (!email || !password) {

    alert(
      'Please enter email and password.'
    );

    return;
  }


  if (password.length < 6) {

    alert(
      'Password must be at least 6 characters.'
    );

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signUp(
      {
        email,
        password
      }
    );


  if (error) {

    alert(
      'Signup failed: ' +
      error.message
    );

    return;
  }


  if (data.session) {

    cloudUser =
      data.user;

    updateCloudStatus();

    alert(
      'Account created and logged in.'
    );

  } else {

    alert(
      'Account created. Please check your email for verification.'
    );

  }

}


/* =========================================================
   SUPABASE LOGIN
   ========================================================= */

async function cloudSignIn() {

  if (!supabaseClient) {

    alert(
      'Supabase is not configured.'
    );

    return;
  }


  const email =
    document
      .getElementById('cloudEmail')
      ?.value
      ?.trim();


  const password =
    document
      .getElementById('cloudPassword')
      ?.value;


  if (!email || !password) {

    alert(
      'Please enter email and password.'
    );

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword(
      {
        email,
        password
      }
    );


  if (error) {

    alert(
      'Login failed: ' +
      error.message
    );

    return;
  }


  cloudUser =
    data.user;


  updateCloudStatus();


  await loadCloudLeads();


  alert(
    'Login successful.'
  );

}


/* =========================================================
   SUPABASE LOGOUT
   ========================================================= */

async function cloudSignOut() {

  if (!supabaseClient) {
    return;
  }


  const { error } =
    await supabaseClient.auth.signOut();


  if (error) {

    alert(
      'Logout failed: ' +
      error.message
    );

    return;
  }


  cloudUser = null;


  updateCloudStatus();

  renderLeads();


  alert(
    'Logged out successfully.'
  );

}


/* =========================================================
   CLOUD STATUS
   ========================================================= */

function updateCloudStatus() {

  const status =
    document.getElementById(
      'cloudStatus'
    );


  if (!status) {
    return;
  }


  if (cloudUser) {

    status.textContent =
      '☁️ Cloud connected: ' +
      cloudUser.email;

  } else {

    status.textContent =
      '☁️ Not logged in';

  }

}


/* =========================================================
   SUPABASE INITIALIZATION
   ========================================================= */

async function cloudInit() {

  if (
    !cloudEnabled ||
    !supabaseClient
  ) {

    console.warn(
      'Supabase is not configured.'
    );

    updateCloudStatus();

    return;
  }


  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    cloudUser =
      session?.user ||
      null;


    updateCloudStatus();


    if (cloudUser) {

      await loadCloudLeads();

    }


    supabaseClient.auth.onAuthStateChange(
      function (
        _event,
        session
      ) {

        cloudUser =
          session?.user ||
          null;

        updateCloudStatus();

      }
    );


  } catch (error) {

    console.error(
      'Supabase initialization error:',
      error
    );

  }

}


/* =========================================================
   PUBLIC REQUIREMENT → SUPABASE
   ========================================================= */

async function publishRequirementOnline() {

  if (!supabaseClient) {

    alert(
      'Supabase is not configured.'
    );

    return;
  }


  const company =
    document.getElementById(
      'reqCompany'
    );

  const person =
    document.getElementById(
      'reqPerson'
    );

  const trade =
    document.getElementById(
      'reqTrade'
    );

  const qty =
    document.getElementById(
      'reqQty'
    );

  const location =
    document.getElementById(
      'reqLocation'
    );

  const message =
    document.getElementById(
      'reqMessage'
    );


  if (
    !company?.value.trim() ||
    !trade?.value ||
    !qty?.value ||
    !location?.value.trim()
  ) {

    alert(
      'Please fill all required fields.'
    );

    return;
  }


  const quantity =
    Number(qty.value);


  if (
    !Number.isFinite(quantity) ||
    quantity <= 0
  ) {

    alert(
      'Please enter a valid worker quantity.'
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from('requirements')
      .insert({

        company_name:
          company.value.trim(),

        contact_person:
          person?.value.trim() ||
          '',

        trade:
          trade.value,

        workers_required:
          quantity,

        location:
          location.value.trim(),

        message:
          message?.value.trim() ||
          '',

        status:
          'open'

      });


  if (error) {

    console.error(
      'Requirement error:',
      error
    );


    alert(
      'Requirement publish failed: ' +
      error.message
    );

    return;
  }


  alert(
    'Requirement published successfully.'
  );


  await loadLiveRequirements();

}

/* =========================================================
   LIVE REQUIREMENTS BOARD
   ========================================================= */

async function loadLiveRequirements() {

  const board =
    document.getElementById(
      'liveRequirements'
    );


  if (!board) {
    return;
  }


  if (!supabaseClient) {

    board.innerHTML =
      '<p>Cloud requirements are currently unavailable.</p>';

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from('requirements')
      .select(
        'company_name,trade,workers_required,location,message,created_at'
      )
      .eq(
        'status',
        'open'
      )
      .order(
        'created_at',
        {
          ascending: false
        }
      )
      .limit(20);


  if (error) {

    console.error(
      'Live requirements error:',
      error
    );


    board.innerHTML =
      '<p>Unable to load live requirements.</p>';

    return;
  }


  if (
    !data ||
    !data.length
  ) {

    board.innerHTML =
      '<p>No live workforce requirements yet.</p>';

    return;
  }


  board.innerHTML =
    data
      .map(function (item) {

        return `

          <div class="requirement-card">

            <h3>
              ${escapeHTML(
                item.trade ||
                'Workforce Requirement'
              )}
            </h3>

            <p>
              <strong>Company:</strong>
              ${escapeHTML(
                item.company_name
              )}
            </p>

            <p>
              <strong>Workers:</strong>
              ${escapeHTML(
                item.workers_required
              )}
            </p>

            <p>
              <strong>Location:</strong>
              ${escapeHTML(
                item.location
              )}
            </p>

            ${
              item.message
                ? `
                  <p>
                    ${escapeHTML(
                      item.message
                    )}
                  </p>
                `
                : ''
            }

          </div>

        `;

      })
      .join('');

}


/* =========================================================
   CSV EXPORT
   ========================================================= */

function exportCRMCSV() {

  if (!leads.length) {

    alert(
      'No CRM leads to export.'
    );

    return;
  }


  const headers = [

    'Company',

    'Region',

    'Contact',

    'Phone',

    'Trade',

    'Need',

    'Source',

    'Follow-up',

    'Status',

    'Website',

    'Notes'

  ];


  const rows =
    leads.map(function (lead) {

      return [

        lead.company,

        lead.region,

        lead.contact,

        lead.phone,

        lead.trade,

        lead.need,

        lead.source,

        lead.follow,

        lead.status,

        lead.website,

        lead.notes

      ];

    });


  const csv =
    [headers, ...rows]

      .map(function (row) {

        return row
          .map(function (value) {

            return (
              '"' +
              String(
                value ?? ''
              ).replace(
                /"/g,
                '""'
              ) +
              '"'
            );

          })
          .join(',');

      })

      .join('\n');


  const blob =
    new Blob(
      ['\ufeff' + csv],
      {
        type:
          'text/csv;charset=utf-8;'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      'a'
    );


  link.href = url;

  link.download =
    'elite-workforce-crm.csv';


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  URL.revokeObjectURL(
    url
  );

}

    if (
      event.target &&

    ) {

      renderLeads();

    }

  }
);

   ========================================================= */

document.addEventListener(
  'change',
  function (event) {

    if (
      event.target &&
      (
        event.target.id ===
          'regionFilter' ||

        event.target.id ===
          'statusFilter'
      )
    ) {

      renderLeads();

    }

  }
);


/* =========================================================

   ========================================================= */

document.addEventListener(
  'click',
  function (event) {

    const modal =
      document.getElementById(
        'leadModal'
      );


    if (
      modal &&
      event.target === modal
    ) {

      closeLeadModal();

    }

  }
);

);
