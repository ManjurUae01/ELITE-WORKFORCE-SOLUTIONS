<script>
const STORAGE_KEY='elite_workforce_private_leads_v1';
let leads=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');

/* =========================================
   SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL='https://maakqzczkhkoimlmnvws.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='PASTE_YOUR_PUBLISHABLE_KEY_HERE';

const cloudEnabled =
  SUPABASE_URL.startsWith('https://') &&
  !SUPABASE_URL.includes('YOUR_') &&
  SUPABASE_PUBLISHABLE_KEY &&
  !SUPABASE_PUBLISHABLE_KEY.includes('YOUR_') &&
  SUPABASE_PUBLISHABLE_KEY !== 'PASTE_YOUR_PUBLISHABLE_KEY_HERE';

const supabaseClient = cloudEnabled
  ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)
  : null;

let cloudUser=null;


/* =========================================
   CLOUD STATUS
   ========================================= */

function setCloudStatus(msg,ok=false){
  const el=document.getElementById('cloudStatus');
  if(el){
    el.textContent=msg;
    el.style.color=ok?'#166534':'#92400e';
  }
}


/* =========================================
   SUPABASE AUTH
   ========================================= */

async function cloudSignUp(){

  if(!cloudEnabled){
    return setCloudStatus(
      'First add your Supabase URL and Publishable key in the code.'
    );
  }

  const email=document.getElementById('cloudEmail').value.trim();
  const password=document.getElementById('cloudPassword').value;

  if(!email || password.length<6){
    return setCloudStatus(
      'Enter a valid email and a password of at least 6 characters.'
    );
  }

  const {data,error}=await supabaseClient.auth.signUp({
    email,
    password
  });

  if(error){
    return setCloudStatus(error.message);
  }

  if(data.user){
    cloudUser=data.user;

    if(data.session){
      setCloudStatus(
        'Account created and logged in: '+data.user.email,
        true
      );
      await loadCloudLeads();
    }else{
      setCloudStatus(
        'Account created. Check your email for confirmation, then login.',
        true
      );
    }
  }
}


async function cloudSignIn(){

  if(!cloudEnabled){
    return setCloudStatus(
      'First add your Supabase URL and Publishable key in the code.'
    );
  }

  const email=document.getElementById('cloudEmail').value.trim();
  const password=document.getElementById('cloudPassword').value;

  if(!email || !password){
    return setCloudStatus('Enter your email and password.');
  }

  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    return setCloudStatus(error.message);
  }

  cloudUser=data.user;

  setCloudStatus(
    'Cloud CRM connected: '+cloudUser.email,
    true
  );

  await loadCloudLeads();
}


async function cloudSignOut(){

  if(!cloudEnabled){
    return;
  }

  await supabaseClient.auth.signOut();

  cloudUser=null;

  setCloudStatus('Logged out from Cloud CRM.');
}


/* =========================================
   CLOUD INITIALIZATION
   ========================================= */

async function cloudInit(){

  if(!cloudEnabled){

    setCloudStatus(
      'Cloud CRM is ready. Add your Supabase Publishable key in this file.'
    );

    return;
  }

  const {data,error}=await supabaseClient.auth.getUser();

  if(error){
    cloudUser=null;
  }else{
    cloudUser=data.user||null;
  }

  if(cloudUser){

    setCloudStatus(
      'Cloud CRM connected: '+cloudUser.email,
      true
    );

    await loadCloudLeads();

  }else{

    setCloudStatus(
      'Cloud database connected. Please login to use your private CRM.',
      true
    );
  }

  await loadLiveRequirements();
}


/* =========================================
   SAVE CRM LEAD TO SUPABASE
   TABLE: crm_leads
   ========================================= */

async function cloudSaveLead(l){

  if(!cloudUser){
    return;
  }

  const row={
    user_id:cloudUser.id,
    company_name:l.company||'',
    contact_person:l.contact||null,
    phone:l.phone||null,
    location:l.region||null,
    industry:l.trade||null,
    requirement:l.need||null,
    lead_source:l.source||null,
    status:l.status||'New',
    follow_up_date:l.follow||null,
    website:l.website||null,
    notes:l.notes||null
  };

  /* Keep existing numeric CRM ID when possible */
  if(/^\d+$/.test(String(l.id))){
    row.id=Number(l.id);
  }

  const {data,error}=await supabaseClient
    .from('crm_leads')
    .upsert(row,{onConflict:'id'})
    .select()
    .single();

  if(error){

    setCloudStatus(
      'Cloud save error: '+error.message
    );

    return null;
  }

  return data;
}


/* =========================================
   SYNC LOCAL CRM TO CLOUD
   ========================================= */

async function syncLocalToCloud(){

  if(!cloudUser){
    return setCloudStatus(
      'Login first, then sync your local leads.'
    );
  }

  let synced=0;

  for(const l of leads){

    const result=await cloudSaveLead(l);

    if(result){

      /* If Supabase generated a new ID, keep it locally */
      if(String(l.id)!==String(result.id)){
        l.id=result.id;
      }

      synced++;
    }
  }

  save();
  renderLeads();

  setCloudStatus(
    synced+' local lead(s) synced to your private cloud CRM.',
    true
  );
}


/* =========================================
   LOAD PRIVATE CRM FROM SUPABASE
   ========================================= */

async function loadCloudLeads(){

  if(!cloudUser){
    return setCloudStatus(
      'Login first to load your private cloud leads.'
    );
  }

  const {data,error}=await supabaseClient
    .from('crm_leads')
    .select(
      'id,company_name,contact_person,phone,location,industry,requirement,lead_source,status,follow_up_date,website,notes,created_at'
    )
    .eq('user_id',cloudUser.id)
    .order('created_at',{ascending:false});

  if(error){

    return setCloudStatus(
      'Cloud load error: '+error.message
    );
  }

  leads=(data||[]).map(l=>({
    id:l.id,
    company:l.company_name||'',
    region:l.location||'',
    contact:l.contact_person||'',
    phone:l.phone||'',
    trade:l.industry||'',
    need:l.requirement||'',
    source:l.lead_source||'',
    follow:l.follow_up_date||'',
    status:l.status||'New',
    website:l.website||'',
    notes:l.notes||''
  }));

  save();
  renderLeads();

  setCloudStatus(
    'Loaded '+leads.length+' private lead(s) from the cloud.',
    true
  );
}


/* =========================================
   DELETE PRIVATE CRM LEAD
   ========================================= */

async function cloudDeleteLead(id){

  if(!cloudUser){
    return;
  }

  const {error}=await supabaseClient
    .from('crm_leads')
    .delete()
    .eq('id',Number(id))
    .eq('user_id',cloudUser.id);

  if(error){

    setCloudStatus(
      'Cloud delete error: '+error.message
    );
  }
}


/* =========================================
   PUBLISH COMPANY REQUIREMENT
   TABLE: requirements
   ========================================= */

async function publishRequirementOnline(){

  if(!cloudEnabled){
    return alert(
      'Cloud database is not connected yet. Add your Supabase Publishable key first.'
    );
  }

  const company=reqCompany.value.trim();
  const person=reqPerson.value.trim();
  const trade=reqTrade.value;
  const qty=Number(reqQty.value);
  const location=reqLocation.value.trim();
  const message=reqMessage.value.trim();

  if(!company || !person || !trade || !qty || !location || !message){
    return alert(
      'Please complete all requirement fields first.'
    );
  }

  const row={
    company_name:company,
    contact_person:person,
    job_type:trade,
    workers_required:qty,
    location:location,
    requirements:message,
    status:'New'
  };

  const {error}=await supabaseClient
    .from('requirements')
    .insert(row);

  if(error){

    return alert(
      'Could not publish requirement: '+error.message
    );
  }

  alert(
    'Requirement published to the live network successfully.'
  );

  await loadLiveRequirements();
}


/* =========================================
   PUBLISH SUPPLIER AVAILABILITY
   TABLE: suppliers
   ========================================= */

async function publishSupplierOnline(){

  if(!cloudEnabled){
    return alert(
      'Cloud database is not connected yet. Add your Supabase Publishable key first.'
    );
  }

  const company=supCompany.value.trim();
  const phone=supPhone.value.trim();
  const trade=supTrade.value;
  const qty=Number(supQty.value);
  const location=supLocation.value.trim();

  if(!company || !phone || !trade || !qty || !location){
    return alert(
      'Please complete all supplier fields first.'
    );
  }

  const row={
    company_name:company,
    phone:phone,
    manpower_types:trade,
    workers_available:qty,
    location:location
  };

  const {error}=await supabaseClient
    .from('suppliers')
    .insert(row);

  if(error){

    return alert(
      'Could not publish supplier availability: '+error.message
    );
  }

  alert(
    'Supplier availability published to the live network successfully.'
  );
}


/* =========================================
   LIVE REQUIREMENTS BOARD
   ========================================= */

async function loadLiveRequirements(){

  const box=document.getElementById('liveRequirements');

  if(!box){
    return;
  }

  if(!cloudEnabled){

    box.innerHTML=
      '<div class="empty">Online network is not connected yet.</div>';

    return;
  }

  const {data,error}=await supabaseClient
    .from('requirements')
    .select(
      'company_name,job_type,workers_required,location,requirements,created_at'
    )
    .eq('status','New')
    .order('created_at',{ascending:false})
    .limit(20);

  if(error){

    box.innerHTML=
      '<div class="empty">Unable to load live requirements.</div>';

    return;
  }

  if(!data || !data.length){

    box.innerHTML=
      '<div class="empty">No live requirements yet. Be the first to publish one.</div>';

    return;
  }

  box.innerHTML=data.map(r=>`
    <div class="live-item">
      <strong>${escapeHTML(r.company_name)}</strong>
      — ${escapeHTML(r.job_type)}
      <b>${escapeHTML(r.workers_required)} worker(s)</b>

      <div class="live-meta">
        ${escapeHTML(r.location)}
        · ${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}
      </div>

      <div style="margin-top:5px">
        ${escapeHTML(r.requirements)}
      </div>
    </div>
  `).join('');
}


/* =========================================
   EXISTING CRM FUNCTIONS
   ========================================= */

function toggleMenu(){
  document.getElementById('navLinks').classList.toggle('active');
}

document.querySelectorAll('#navLinks a').forEach(a=>{
  a.addEventListener('click',()=>{
    document.getElementById('navLinks').classList.remove('active');
  });
});


function escapeHTML(v){
  return String(v??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );
}


function save(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(leads)
  );
}


function today(){
  return new Date().toISOString().slice(0,10);
}


function renderLeads(){

  const q=document
    .getElementById('searchLead')
    .value
    .toLowerCase()
    .trim();

  const region=document.getElementById('regionFilter').value;
  const status=document.getElementById('statusFilter').value;

  const filtered=leads.filter(l=>{

    const text=[
      l.company,
      l.region,
      l.contact,
      l.phone,
      l.trade,
      l.need,
      l.source,
      l.notes
    ].join(' ').toLowerCase();

    return
      (!q||text.includes(q)) &&
      (!region||l.region===region) &&
      (!status||l.status===status);
  });

  const body=document.getElementById('leadBody');

  body.innerHTML=filtered.map(l=>`
    <tr>
      <td>
        <strong>${escapeHTML(l.company)}</strong>
        ${l.website
          ? `<br><a href="${escapeHTML(l.website)}"
              target="_blank"
              style="color:var(--blue);font-size:11px">
              Website
             </a>`
          : ''
        }
      </td>

      <td>${escapeHTML(l.region)}</td>

      <td>${escapeHTML(l.contact)}</td>

      <td>
        ${l.phone
          ? `<a href="tel:${escapeHTML(l.phone)}"
              style="color:var(--blue)">
              ${escapeHTML(l.phone)}
             </a>`
          : ''
        }
      </td>

      <td>${escapeHTML(l.trade)}</td>

      <td>${escapeHTML(l.need)}</td>

      <td>${escapeHTML(l.source)}</td>

      <td>${escapeHTML(l.follow||'—')}</td>

      <td>
        <span class="badge ${
          String(l.status)
          .toLowerCase()
          .replace('-','')
        }">
          ${escapeHTML(l.status)}
        </span>
      </td>

      <td>${escapeHTML(l.notes||'')}</td>

      <td>
        <div class="lead-actions">

          <button
            class="icon-btn"
            title="Edit"
            onclick="editLead('${l.id}')">
            ✏️
          </button>

          ${
            l.phone
            ? `<button
                class="icon-btn"
                title="WhatsApp"
                onclick="whatsLead('${escapeHTML(l.phone)}','${escapeHTML(l.company)}')">
                💬
              </button>`
            : ''
          }

          <button
            class="icon-btn delete"
            title="Delete"
            onclick="deleteLead('${l.id}')">
            🗑️
          </button>

        </div>
      </td>
    </tr>
  `).join('');

  document.getElementById('emptyLeads').style.display=
    filtered.length?'none':'block';

  updateStats();
}


function updateStats(){

  document.getElementById('statTotal').textContent=
    leads.length;

  document.getElementById('statNew').textContent=
    leads.filter(l=>l.status==='New').length;

  document.getElementById('statFollow').textContent=
    leads.filter(l=>l.status==='Follow-up').length;

  document.getElementById('statConverted').textContent=
    leads.filter(l=>l.status==='Converted').length;

  document.getElementById('statToday').textContent=
    leads.filter(l=>
      l.follow &&
      l.follow<=today() &&
      l.status!=='Converted' &&
      l.status!=='Closed'
    ).length;
}


function openLeadModal(id=null){

  document.getElementById('leadModal')
    .classList.add('active');

  document.getElementById('modalTitle').textContent=
    id?'Edit Lead':'Add New Lead';

  document.getElementById('leadId').value=id||'';

  if(id){

    const l=leads.find(x=>String(x.id)===String(id));

    if(l) fillLead(l);

  }else{

    [
      'leadCompany',
      'leadContact',
      'leadPhone',
      'leadNeed',
      'leadSource',
      'leadWebsite',
      'leadNotes',
      'leadFollow'
    ].forEach(x=>{
      document.getElementById(x).value='';
    });

    document.getElementById('leadRegion').value='JAFZA';
    document.getElementById('leadStatus').value='New';
    document.getElementById('leadTrade').value='Electrician';
  }
}


function fillLead(l){

  for(const k of [
    'company',
    'region',
    'contact',
    'phone',
    'trade',
    'need',
    'source',
    'follow',
    'status',
    'website',
    'notes'
  ]){

    const el=document.getElementById(
      'lead'+k.charAt(0).toUpperCase()+k.slice(1)
    );

    if(el){
      el.value=l[k]||'';
    }
  }
}


function closeLeadModal(){
  document.getElementById('leadModal')
    .classList.remove('active');
}


function saveLead(e){

  e.preventDefault();

  const id=document.getElementById('leadId').value;

  const l={
    id:id||Date.now().toString(),
    company:leadCompany.value.trim(),
    region:leadRegion.value,
    contact:leadContact.value.trim(),
    phone:leadPhone.value.trim(),
    trade:leadTrade.value,
    need:leadNeed.value.trim(),
    source:leadSource.value.trim(),
    follow:leadFollow.value,
    status:leadStatus.value,
    website:leadWebsite.value.trim(),
    notes:leadNotes.value.trim()
  };

  if(id){

    const i=leads.findIndex(
      x=>String(x.id)===String(id)
    );

    if(i>-1){
      leads[i]=l;
    }

  }else{

    leads.unshift(l);
  }

  save();
  closeLeadModal();
  renderLeads();

  if(cloudUser){
    cloudSaveLead(l);
  }
}


function editLead(id){
  openLeadModal(id);
}


async function deleteLead(id){

  if(!confirm('Delete this lead?')){
    return;
  }

  leads=leads.filter(
    l=>String(l.id)!==String(id)
  );

  save();
  renderLeads();

  if(cloudUser){
    await cloudDeleteLead(id);
  }
}


function whatsLead(phone,company){

  const p=phone.replace(/[^\d]/g,'');

  window.open(
    'https://wa.me/'+p+
    '?text='+
    encodeURIComponent(
      'Hello, I am contacting you from Elite Workforce Solutions regarding workforce/manpower requirements for '+company+'.'
    ),
    '_blank'
  );
}


function exportCSV(){

  const headers=[
    'Company',
    'Region',
    'Contact',
    'Phone',
    'Trade',
    'Need',
    'Source',
    'Follow-up Date',
    'Status',
    'Website',
    'Notes'
  ];

  const rows=leads.map(l=>[
    l.company,
    l.region,
    l.contact,
    l.phone,
    l.trade,
    l.need,
    l.source,
    l.follow,
    l.status,
    l.website,
    l.notes
  ]);

  const csv=[
    headers,
    ...rows
  ].map(r=>
    r.map(x=>
      `"${String(x??'').replace(/"/g,'""')}"`
    ).join(',')
  ).join('\n');

  const blob=new Blob(
    ['\ufeff'+csv],
    {type:'text/csv;charset=utf-8;'}
  );

  const a=document.createElement('a');

  a.href=URL.createObjectURL(blob);
  a.download='elite-workforce-leads.csv';
  a.click();

  URL.revokeObjectURL(a.href);
}

/* =========================================
   MODAL
   ========================================= */

document
  .getElementById('leadModal')
  .addEventListener('click',e=>{
    if(e.target.id==='leadModal'){
      closeLeadModal();
    }
  });


/* =========================================
   START
   ========================================= */

renderLeads();
cloudInit();
</script>
